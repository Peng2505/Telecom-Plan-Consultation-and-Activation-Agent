services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ragagent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ragagent_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "max_connections=200"]

  api:
    build: .
    container_name: ragagent_api
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8012"
      DB_URI: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      CHROMADB_DIRECTORY: /app/chromaDB
      RUN_INGEST: ${RUN_INGEST:-auto}
    ports:
      - "8012:8012"
    volumes:
      - ./chromaDB:/app/chromaDB
      - ./output:/app/output
      - ./knowledge:/app/knowledge:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/docker/entrypoint-api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8012/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build: .
    container_name: ragagent_web
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8012
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      APP_API_KEY: ${APP_API_KEY:-}
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/docker/entrypoint-web.sh"]

volumes:
  ragagent_pgdata:
